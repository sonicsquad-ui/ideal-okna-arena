<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46" stroke="url(#compassGrad)" stroke-width="3" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="41" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2 3"/>
  
  <!-- Cardinal ticks -->
  <line x1="50" y1="12" x2="50" y2="17" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="83" x2="50" y2="88" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="17" y2="50" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="83" y1="50" x2="88" y2="50" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Compass Needle: North (Golden) -->
  <polygon points="50,18 57,47 50,45" fill="url(#needleNorth)"/>
  <polygon points="50,18 43,47 50,45" fill="#B45309"/>

  <!-- Compass Needle: South (Silver/Slate) -->
  <polygon points="50,82 57,53 50,55" fill="url(#needleSouth)"/>
  <polygon points="50,82 43,53 50,55" fill="#475569"/>

  <!-- Center Pivot -->
  <circle cx="50" cy="50" r="6" fill="#1E3A8A"/>
  <circle cx="50" cy="50" r="3" fill="#FFFFFF"/>
</svg>
